<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi-X Desktop</title>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
    <div id="app">
        <!-- 遮罩层（点击关闭面板） -->
        <div id="di-overlay" onclick="closePanel()"></div>

        <!-- DeepIntent 抽屉面板 -->
        <aside id="di-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/><path d="M12 6v6l4 2"/></svg>
                    DeepIntent
                </div>
                <div class="panel-version">v2.1.0</div>
            </div>

            <div id="health-banner" class="health-banner loading-pulse">
                正在初始化...
            </div>

            <div class="card">
                <div class="card-title">健康检查</div>
                <div id="health-checks"></div>
            </div>

            <div class="card">
                <div class="card-title">CPU Regulator</div>
                <div class="metric-row">
                    <div class="metric-box">
                        <div class="metric-title">当前模式</div>
                        <div id="reg-mode" class="metric-number" style="color:#6e7681">--</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">CPU 负载</div>
                        <div id="reg-cpu" class="metric-number" style="color:#6e7681">--</div>
                    </div>
                </div>
                <div id="reg-thresholds"></div>
            </div>

            <div class="card">
                <div class="card-title">5 个闭环验证器</div>
                <div id="loop-validators"></div>
            </div>

            <div class="card">
                <div class="card-title">对话学习（越用越懂）</div>
                <div id="learning-panel">
                    <input type="text" id="learn-input" placeholder="输入本次对话主题..." 
                        style="width:100%;padding:8px 10px;margin-bottom:8px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;font-size:12px;box-sizing:border-box;">
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-primary" id="btn-learn" style="flex:1;font-size:12px;padding:6px;">学习</button>
                        <button class="btn" id="btn-like" style="flex:1;font-size:12px;padding:6px;">👍</button>
                        <button class="btn" id="btn-dislike" style="flex:1;font-size:12px;padding:6px;">👎</button>
                    </div>
                    <div id="learn-status" style="margin-top:6px;font-size:11px;color:#6e7681;min-height:16px;"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">GitHub</div>
                <div id="github-status">
                    <div class="status-row">
                        <span class="status-dot neutral" id="gh-dot"></span>
                        <span class="status-label">认证状态</span>
                        <span class="status-value neutral" id="gh-user">--</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">会话记忆</div>
                <div id="session-memory">
                    <div class="status-row">
                        <span class="status-dot neutral"></span>
                        <span class="status-label">上次会话</span>
                        <span class="status-value neutral" id="mem-last-session">--</span>
                    </div>
                    <div class="status-row">
                        <span class="status-dot neutral"></span>
                        <span class="status-label">项目状态</span>
                        <span class="status-value neutral" id="mem-project">--</span>
                    </div>
                </div>
            </div>

            <div class="card" id="project-memory-card" style="display:none;">
                <div class="card-title">项目记忆 <span style="font-weight:normal;color:#6e7681;">.kimi-x/PROJECT.md</span></div>
                <div id="project-memory-content" class="project-memory-content"></div>
            </div>

            <div class="card">
                <div class="card-title">记忆银行</div>
                <div id="memory-bank"></div>
            </div>

            <div class="card">
                <div class="card-title">API 密钥</div>
                <input type="password" id="api-key-input" placeholder="输入 API 密钥（可选）..."
                    style="width:100%;padding:8px 10px;margin-bottom:8px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;font-size:12px;box-sizing:border-box;">
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-primary" id="btn-save-key" style="flex:1;font-size:12px;padding:6px;">保存密钥</button>
                    <button class="btn" id="btn-clear-key" style="flex:1;font-size:12px;padding:6px;">清除</button>
                </div>
                <div id="key-status" style="margin-top:6px;font-size:11px;color:#6e7681;min-height:16px;"></div>
            </div>

            <div class="card">
                <div class="card-title">快捷操作</div>
                <button class="btn btn-primary" id="btn-diagnose" disabled>/diagnose</button>
                <button class="btn" id="btn-evolve" disabled>/evolve</button>
                <button class="btn" id="btn-backup" disabled>/backup</button>
            </div>

            <div style="height: 16px;"></div>
        </aside>

        <!-- Kimi Web UI iframe -->
        <div id="kimi-frame-container">
            <!-- 悬浮按钮 -->
            <button id="di-fab" onclick="togglePanel()" title="DeepIntent 状态">
                <span class="dot init" id="fab-dot"></span>
                <span>DeepIntent</span>
            </button>
            <iframe id="kimi-frame" src="http://127.0.0.1:5494/"></iframe>
        </div>
    </div>

    <script src="panel.js"></script>
</body>
</html>
